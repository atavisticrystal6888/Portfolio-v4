name: Lighthouse CI

on:
  push:
    branches: [main]
    paths:
      - "portfolio-next/**"
  pull_request:
    paths:
      - "portfolio-next/**"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-next

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-next/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: portfolio-next/lighthouserc.json
          uploadArtifacts: true
